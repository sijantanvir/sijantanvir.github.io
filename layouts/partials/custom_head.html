<meta name="google-site-verification" content="SIuaOpRUlj6uXaYUPysVz-M1RaGfTj3SRB9OJjbQxvM">
<meta property="og:site_name" content="{{ site.Title }}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.Title | jsonify }},
  "url": {{ site.BaseURL | jsonify }},
  "description": {{ .Site.Params.description | default (printf "Personal academic website of %s." site.Title) | jsonify }},
  "publisher": {
    "@type": "Person",
    "name": {{ site.Title | jsonify }}
  }
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.Title | jsonify }},
  "url": {{ site.BaseURL | jsonify }},
  "jobTitle": "Prospective PhD Applicant",
  "affiliation": {
    "@type": "CollegeOrUniversity",
    "name": "Jahangirnagar University"
  },
  "sameAs": [
    "https://github.com/sijantanvir",
    "https://www.linkedin.com/in/tanvir-sijan",
    "https://x.com/TanvirSijan",
    "https://scholar.google.com/citations?hl=en&user=DAlfcbkAAAAJ"
  ]
}
</script>
